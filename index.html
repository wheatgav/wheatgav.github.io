<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<title>Strike — De la pierre aux étoiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#f0a04b;--gold:#f6c65b;--glass:rgba(14,12,10,.58);--line:rgba(255,236,210,.14);--txt:#fff7ec;--dim:rgba(255,240,220,.62);--ok:#7be38a;--bad:#ff7a6a;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
--f1:'Cinzel',Georgia,'Times New Roman',serif;--f2:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0b09;color:var(--txt);font-family:var(--f2);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:var(--f2);color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .5s}
#hud.off{opacity:0}
#money{position:absolute;left:calc(14px + var(--sl));top:calc(12px + var(--st));padding:10px 16px 10px 12px;display:flex;gap:12px;align-items:center;min-width:190px}
#money svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 6px rgba(246,198,91,.45))}
#mval{font-size:26px;font-weight:800;letter-spacing:.2px;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.35)}
#mval.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.08)}}
#ips{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
#ips b{color:var(--ok);font-weight:700}
#frz{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;background:linear-gradient(90deg,#ff8a3a,#ffd060);color:#2a1406;font-weight:800;font-size:11px;letter-spacing:.5px;animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.3);transform:scale(1.06)}}
#era{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + var(--st));padding:8px 16px 10px;text-align:center;min-width:250px}
#eraT{font-family:var(--f1);font-weight:700;font-size:14px;letter-spacing:2.4px;text-transform:uppercase;color:var(--acc);white-space:nowrap}
#pips{display:flex;gap:5px;justify-content:center;margin-top:7px;align-items:center}
.pip{width:20px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);transition:background .4s,box-shadow .4s}
.pip.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.pip.mon{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);margin-left:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.pip.mon i{position:absolute;left:0;bottom:0;width:100%;background:var(--gold);transition:height .4s}
#quest{position:absolute;right:calc(14px + var(--sr));top:calc(12px + var(--st));width:250px;padding:11px 14px 12px}
#qh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:700}
#qd{font-size:14px;font-weight:600;margin:5px 0 8px;line-height:1.3}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:4px;transition:width .35s}
#qr{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between}
#qr b{color:var(--gold)}
#quest.done{animation:qdone .9s}
@keyframes qdone{30%{transform:scale(1.04);box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(246,198,91,.5)}}
#menuBtn{position:absolute;right:calc(14px + var(--sr));top:calc(128px + var(--st));width:42px;height:42px;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#menuBtn svg{width:20px;height:20px}
#lig{position:absolute;left:calc(14px + var(--sl));top:calc(86px + var(--st));padding:5px 10px;font-size:12px;font-weight:600;color:var(--gold)}
#boosts{position:absolute;left:calc(14px + var(--sl));top:calc(86px + var(--st));display:flex;gap:6px;flex-wrap:wrap;max-width:330px}
.bc{padding:4px 9px;border-radius:9px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--gold);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bc i{font-style:normal;font-weight:600;color:var(--dim);font-size:10.5px;margin-right:5px;letter-spacing:.3px}
#shopBtn{position:absolute;right:calc(64px + var(--sr));top:calc(128px + var(--st));height:42px;padding:0 14px 0 11px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;pointer-events:auto}
#shopDot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#7be38a;box-shadow:0 0 10px #7be38a;animation:pulse .7s infinite alternate}
.shop{width:min(520px,100%)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--dim)}
.tabs button.on{background:linear-gradient(180deg,#ffd47a,#e9a23b);color:#2a1606}
.sinfo{font-size:12.5px;color:var(--dim);text-align:center;margin-bottom:8px}.sinfo b{color:#fff}
.slist{display:flex;flex-direction:column;gap:6px;max-height:min(52vh,460px);overflow:auto;padding-right:2px;touch-action:pan-y}
.srow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);opacity:.55}
.srow.have{opacity:.85}.srow.next{opacity:1;border-color:rgba(246,198,91,.45);background:rgba(246,198,91,.07)}
.sic{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex:none}
.orb{width:24px;height:24px;border-radius:50%;display:block}
.snm{flex:1;font-weight:700;font-size:14px}.snm small{display:block;font-weight:600;color:var(--dim);font-size:11.5px}
.own{font-size:12px;font-weight:700;color:var(--dim)}.own.eq{color:var(--ok)}
.lock{font-size:11.5px;font-weight:700;color:rgba(255,240,220,.45);text-align:right}
.buy{padding:9px 14px;border-radius:10px;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.1);color:var(--bad);border:1px solid rgba(255,122,106,.35)}
.buy.ok{background:linear-gradient(180deg,#8ef09a,#3fbf5a);color:#0d2a12;border-color:transparent;box-shadow:0 4px 16px rgba(63,191,90,.35)}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross .dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.8);opacity:.9}
#ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;opacity:0;transition:opacity .2s}
#ring.on{opacity:1}
#combo{position:absolute;left:34px;top:-44px;font-family:var(--f1);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo small{font-family:var(--f2);font-size:11px;font-weight:700;letter-spacing:1px;display:block;color:#fff;opacity:.8}
#prompt{position:absolute;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%);padding:10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#prompt.on{opacity:1}
.key{display:inline-flex;min-width:28px;height:28px;padding:0 7px;align-items:center;justify-content:center;border-radius:7px;background:rgba(255,255,255,.92);color:#1b140c;font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#prompt .sub{display:block;font-size:12px;color:var(--dim);font-weight:500}
#prompt .c{font-weight:800}
#prompt .c.ok{color:var(--ok)} #prompt .c.no{color:var(--bad)}
#hint{position:absolute;left:50%;bottom:calc(98px + var(--sb));transform:translateX(-50%);padding:9px 16px;font-size:13.5px;font-weight:600;max-width:min(560px,90vw);text-align:center;opacity:0;transition:opacity .4s;border-color:rgba(246,198,91,.45)}
#hint.on{opacity:1}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(84px + var(--st));display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,90vw)}
.toast{padding:10px 16px 10px 12px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;animation:tin .4s cubic-bezier(.2,1.4,.4,1);max-width:100%}
.toast .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:rgba(246,198,91,.18);color:var(--gold)}
.toast small{display:block;font-weight:500;color:var(--dim);font-size:12px}
.toast.out{animation:tout .4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#fps{position:absolute;left:calc(14px + var(--sl));bottom:calc(10px + var(--sb));font-size:11px;color:var(--dim);font-weight:600}
#keys{position:absolute;left:calc(14px + var(--sl));bottom:calc(14px + var(--sb));font-size:11.5px;color:var(--dim);line-height:1.9;padding:8px 12px}
#keys .key{min-width:22px;height:20px;font-size:11px;margin-right:3px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plabel{position:absolute;transform:translate(-50%,-100%);padding:8px 13px 9px;text-align:center;white-space:nowrap;transition:opacity .25s;will-change:transform}
.plabel .n{font-family:var(--f1);font-weight:700;font-size:14px;letter-spacing:.6px}
.plabel .c{font-size:15px;font-weight:800;margin-top:2px}
.plabel .c.ok{color:var(--ok)} .plabel .c.no{color:var(--bad)}
.plabel .g{font-size:11.5px;color:var(--dim);font-weight:600}
.plabel.mon{border-color:rgba(246,198,91,.6);box-shadow:0 0 30px rgba(246,198,91,.25)}
.plabel.mon .n{color:var(--gold)}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:#ffe9a8;text-shadow:0 2px 8px rgba(0,0,0,.65),0 0 18px rgba(255,180,60,.4);white-space:nowrap;animation:popup 1.1s ease-out forwards}
.pop.p{font-size:26px;color:#ffd060}
.pop.p small{display:block;font-size:12px;letter-spacing:2px;color:#fff;text-align:center}
.pop.s{font-size:15px;color:#c9f0ff}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(0,0,0,.12);opacity:0;transition:opacity .2s}
#joy.on{opacity:1}
#joyK{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#joyHint{position:absolute;left:calc(40px + var(--sl));bottom:calc(60px + var(--sb));width:100px;height:100px;border-radius:50%;border:2px dashed rgba(255,255,255,.22)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(14,12,10,.45);border:2px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .08s,background .15s}
.tb:active,.tb.dn{transform:scale(.92);background:rgba(246,198,91,.35)}
.tb svg{width:46%;height:46%}
#tbHit{right:calc(26px + var(--sr));bottom:calc(46px + var(--sb));width:92px;height:92px;border-color:rgba(246,198,91,.7)}
#tbJump{right:calc(132px + var(--sr));bottom:calc(30px + var(--sb));width:62px;height:62px}
#tbAct{right:calc(40px + var(--sr));bottom:calc(152px + var(--sb));width:66px;height:66px;border-color:rgba(123,227,138,.8)}
#tbAct span{position:absolute;bottom:-20px;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:0 1px 4px #000}
#tbRun{right:calc(140px + var(--sr));bottom:calc(110px + var(--sb));width:52px;height:52px}
#tbRun.on{background:rgba(123,227,138,.35)}
/* cinematic */
#cine{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s cubic-bezier(.6,0,.2,1)}
#lbT{top:0} #lbB{bottom:0}
#cine.on .lb{height:11vh}
#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1s,transform 2.4s;width:92vw;padding:40px 0}
#card::before{content:'';position:absolute;inset:-30% 0;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 62%);z-index:-1}
#card.on{opacity:1;transform:translate(-50%,-54%)}
#cardK{font-family:var(--f2);font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--dim);font-weight:700}
#cardT{font-family:var(--f1);font-weight:900;font-size:clamp(34px,7vw,78px);letter-spacing:4px;line-height:1.05;margin:10px 0;background:linear-gradient(180deg,#fff7e6,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(0,0,0,.5))}
#cardS{font-family:var(--f1);font-size:clamp(14px,2.2vw,20px);color:#fff;opacity:.92;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#cardK{text-shadow:0 2px 10px rgba(0,0,0,.8)}
#count{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f1);font-weight:900;font-size:120px;color:#fff;text-shadow:0 0 40px rgba(255,160,60,.8);opacity:0}
#count.go{animation:cnt 1s}
@keyframes cnt{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity .8s}
#fade.out{opacity:0}
/* screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--st)) calc(20px + var(--sr)) calc(20px + var(--sb)) calc(20px + var(--sl));pointer-events:auto;animation:fin .35s}
@keyframes fin{from{opacity:0}}
.scr.dim{background:rgba(6,5,4,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel{width:min(460px,100%);max-height:100%;overflow:auto;padding:26px 26px 22px;border-radius:20px;background:rgba(18,15,12,.82);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pin .4s cubic-bezier(.2,1.2,.4,1);touch-action:pan-y}
@keyframes pin{from{transform:translateY(16px) scale(.97);opacity:0}}
.panel h2{font-family:var(--f1);font-weight:700;font-size:24px;letter-spacing:2px;text-align:center;margin-bottom:4px}
.panel .sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:18px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:12px;font-weight:700;font-size:15px;letter-spacing:.3px;background:rgba(255,255,255,.07);border:1px solid var(--line);margin-top:10px;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,236,210,.3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#ffd47a,#e9a23b);color:#2a1606;border-color:transparent;box-shadow:0 6px 24px rgba(233,162,59,.35)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.red{color:#ffb4a8;border-color:rgba(255,122,106,.35)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
/* title */
#title{flex-direction:column;justify-content:space-between;padding-top:calc(9vh + var(--st));padding-bottom:calc(5vh + var(--sb));background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.65))}
#logo{text-align:center}
#logo h1{font-family:var(--f1);font-weight:900;font-size:clamp(64px,13vw,150px);letter-spacing:clamp(8px,2vw,22px);line-height:.95;background:linear-gradient(180deg,#fffaf0 10%,#f6c65b 55%,#b06a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(0,0,0,.55));padding-left:clamp(8px,2vw,22px)}
#logo p{font-family:var(--f1);font-size:clamp(13px,2vw,19px);letter-spacing:clamp(3px,.8vw,8px);text-transform:uppercase;color:#fff;opacity:.9;margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#tmenu{width:min(340px,88vw)}
#tsave{text-align:center;font-size:12.5px;color:var(--dim);margin-top:12px;min-height:16px}
#tfoot{text-align:center;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:1px}
/* login */
.inp{display:block;width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-family:var(--f2);font-size:16px;font-weight:600;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;margin-bottom:4px}
.inp:focus{border-color:rgba(246,198,91,.7);background:rgba(255,255,255,.1)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.4px;margin:12px 0 6px}
.err{min-height:18px;font-size:13px;font-weight:600;color:var(--bad);margin-top:6px;text-align:center}
.who{text-align:center;font-size:12.5px;color:var(--dim);margin-top:12px}.who b{color:#fff}.who button{color:var(--gold);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;padding:2px}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:600}
.set span small{display:block;font-weight:500;color:var(--dim);font-size:11.5px}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:rgba(246,198,91,.92);color:#2a1606}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:6px;border-radius:4px;background:rgba(255,255,255,.15);outline:none;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--gold)}
.tg{width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;flex:none}
.tg::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--ok)} .tg.on::after{transform:translateX(20px)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.stat{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.stat small{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.stat b{font-size:16px;font-weight:800}
.help{font-size:13.5px;line-height:1.55;color:rgba(255,245,230,.88)}
.help h3{font-family:var(--f1);font-size:15px;letter-spacing:1px;margin:14px 0 6px;color:var(--gold)}
.help p{margin-bottom:6px}

      R.add(M.mesh, m, { build: easeOut(prog), bh: M.h });
      M.parts.forEach(p => { const pm = this.partMatrix(m, p, 0, t); if (p.mode === 'rocket' && this.rocketY) M4.translate(pm, 0, this.rocketY, 0); R.add(p.mesh, pm, { build: easeOut(prog), bh: M.h }); });
    }
    // pad
    const ui = this.ui; ui.beginLabels();
    if (this.pad && (this.mode === 'play')) {
      const pd = this.pad, ok = S.money >= pd.cost, ap = easeOut(Math.min(1, this.padT * 2));
      const pm = TRS(pd.p[0], 0, pd.p[2], 0, [ap * (pd.kind === 'm' ? 1.4 : 1), 1, ap * (pd.kind === 'm' ? 1.4 : 1)]);
      const col = pd.kind === 'm' ? [3, 2.2, .7] : ok ? [.7, 2.6, 1.0] : [1.6, 1.3, 1.1];
      R.add(this.padMesh, pm, { tint: col, flash: .15 + Math.sin(t * 4) * .1, noShadow: true });
      const am = TRS(pd.p[0], 2.3 + Math.sin(t * 3) * .18, pd.p[2], t * 1.5); R.add(this.arrowMesh, am, { tint: col, noShadow: true });
      if (Math.random() < dt * 12) this.pA.emit(pd.p[0] + (Math.random() - .5) * 2, .15, pd.p[2] + (Math.random() - .5) * 2, 0, .8 + Math.random(), 0, 1, .12, .02, [col[0] * 1.5, col[1] * 1.5, col[2] * 1.5, 1], [col[0] * .5, col[1] * .5, col[2] * .5, 1], 0, .5);
      const sp = this.proj(pd.p[0], 3.0, pd.p[2]);
      if (sp) { const nmB = pd.kind === 'm' ? ERAS[S.era].mon : ERAS[S.era].b[pd.i][0]; const g = pd.kind === 'm' ? 'Monument · ouvre l\'ère suivante' : `+${fmt(bInc(S.era, pd.i, 1) * this.eco.mult())} /s`; ui.label('pad', sp[0], sp[1], `<div class="n">${nmB}</div><div class="c ${ok ? 'ok' : 'no'}">${fmt(pd.cost)}</div><div class="g">${g}</div>`, pd.kind === 'm' ? 'mon' : '', clamp(1.4 - sp[2] / 40, .35, 1)); }
    }
    ui.endLabels();
    // relics
    if (S.aura > 0 && this.mode === 'play') { const ac = lin(AURAS[S.aura][4]); const am = TRS(this.P.p[0], this.P.p[1] + .04, this.P.p[2], this.time * 1.5, [.75, 1, .75]); R.add(this.ringMesh, am, { tint: [ac[0] * 2.5, ac[1] * 2.5, ac[2] * 2.5], noShadow: true }); const am2 = TRS(this.P.p[0], this.P.p[1] + .05, this.P.p[2], -this.time, [.5, 1, .5]); R.add(this.ringMesh, am2, { tint: [ac[0] * 2, ac[1] * 2, ac[2] * 2], noShadow: true }); }
    for (let k = 0; k < 3; k++) { if (S.relics[relicKey(THEME, S.era, k)]) continue; const rp = RELIC_SPOTS[S.era][k]; R.add(a.relic, TRS(rp[0], 1.1 + Math.sin(t * 2 + k) * .12, rp[2], t * 1.2, 1.6), { flash: .1 + Math.sin(t * 5) * .08 }); }
    // first person
    if (this.mode === 'play') this.drawFP(a, dt);
    R.render(env, [this.pB, this.pA]);
  }
  partMatrix(m, p, ang, t) {
    const pm = M4.copy(M4.ident(), m); M4.translate(pm, p.at[0], p.at[1], p.at[2]); if (p.ry) M4.rotY(pm, p.ry);
    if (p.mode === 'flag') M4.rotY(pm, Math.sin(t * 1.3 + p.at[0]) * .25);
    else if (p.mode === 'robot') { M4.rotY(pm, Math.sin(t * 1.4 + p.at[0]) * 1.2); }
    else if (p.mode === 'spin') { if (p.ax === 'x') M4.rotX(pm, ang); else if (p.ax === 'y') M4.rotY(pm, ang); else M4.rotZ(pm, ang); }
    return pm;
  }
  drawWorker(i, a) {
    const w = this.slot[i].w, B = a.b[i], ang = SLOT_ANG[i], R = this.R, Pm = a.person;
    const r0 = SLOT_R - B.r - .6, r1 = 2.95, rr = lerp(r0, r1, w.pos), p = polar(ang, rr);
    const moving = w.st === 'go' || w.st === 'back', carry = w.st === 'go' || (w.st === 'drop' && w.t < .25);
    const toC = [-Math.sin(ang), Math.cos(ang)]; let face = w.st === 'back' || w.st === 'work' ? Math.atan2(-toC[0], -toC[1]) : Math.atan2(toC[0], toC[1]);
    if (w.st === 'drop') face = Math.atan2(toC[0], toC[1]);
    const ph = w.ph, sw = moving ? Math.sin(ph) : 0, bob = moving ? Math.abs(Math.cos(ph)) * .045 : 0;
    const hip = TRS(p[0], .95 + bob, p[2], face);
    const torso = M4.copy(M4.ident(), hip); M4.rotY(torso, sw * .08); if (w.st === 'work') M4.rotX(torso, .25 + Math.sin(w.t * 6) * .05);
    R.add(Pm.torso, torso);
    const hd = M4.copy(M4.ident(), torso); M4.translate(hd, 0, .62, 0); M4.rotY(hd, w.st === 'work' ? Math.sin(w.t * .9) * .3 : 0); R.add(Pm.head, hd);
    [-1, 1].forEach(s => {
      const am = M4.copy(M4.ident(), torso); M4.translate(am, s * .26, .55, 0);
      let rx = moving ? -sw * s * .5 : 0; if (carry) rx = -1.15; if (w.st === 'work') rx = s > 0 ? -1.3 - Math.max(0, Math.sin(w.t * 6)) * 1.0 : -.5; if (w.st === 'drop') rx = -1.15 + w.t * 2;
      M4.rotX(am, rx); M4.rotZ(am, s * .08); R.add(Pm.arm, am);
      const lm = M4.copy(M4.ident(), hip); M4.translate(lm, s * .1, 0, 0); M4.rotX(lm, moving ? sw * s * .55 : 0); R.add(Pm.leg, lm);
    });
    if (carry) { const im = M4.copy(M4.ident(), torso); M4.translate(im, 0, .18, .42); R.add(Pm.item, im); }
  }
  drawFP(a, dt) {
    const R = this.R, cw = R.camWorld(), hb = this.handBob || { bx: 0, by: 0, bobA: 0 }, t = this.time;
    let sx = 0, sz = 0; const s = this.swing;
    if (s >= 0) { if (s < .3) { const k = easeOut(s / .3); sx = k * 1.0; sz = -k * .35; } else if (s < .45) { const k = (s - .3) / .15; sx = 1.0 - 2.3 * k * k; sz = -.35 + .55 * k * k; } else { const k = (s - .45) / .55, e = Math.exp(-5 * k) * Math.cos(k * 7); sx = -1.3 * e; sz = .2 * e; } }
    const breathe = Math.sin(t * 1.7) * .006;
    const m = M4.copy(M4.ident(), cw), ax = clamp((R.w / R.h) / 1.7, .42, 1);
    M4.translate(m, .34 * ax + .02 - hb.bx * .6 - this.lagY * .4, -.36 - hb.by * .5 + breathe - this.lagP + (s > .3 && s < .5 ? -.03 : 0), -.06 - this.tap * .08);
    M4.rotY(m, -.16 + this.lagY); M4.rotX(m, .14 + sx + this.lagP * 2); M4.rotZ(m, sz);
    R.addFP(a.fp.arm, m);
    const tm = M4.copy(M4.ident(), m); M4.translate(tm, -.01, .02, -.64); M4.rotX(tm, -.62); M4.rotZ(tm, .18); M4.scale(tm, .62, .62, .62); M4.translate(tm, 0, -.18, 0); R.addFP(this.picks[this.S.pick], tm);
    const up = this.tapArm = Math.max(this.tap, (this.tapArm || 0) - dt * 3);
    if (up > .01) { const lm = M4.copy(M4.ident(), cw); const k = easeOut(up); M4.translate(lm, -.26 + hb.bx * .5, -.62 + k * .3 - hb.by * .4, -.1 - k * .05); M4.rotY(lm, .25 - k * .15); M4.rotX(lm, .5 * k + .2); R.addFP(a.fp.arm, lm); }
  }
}

// ---------- boot ----------
window.addEventListener('load', () => {
  const g = new Game(); window.ERES = { g, ECO, bCost, fmt, setWorld, eras: () => ERAS };
});

})();
